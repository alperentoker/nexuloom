services:
  nexuloom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexuloom-app
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    environment:
      - PORT=${PORT:-8001}
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - NEXULOOM_ENV=development
      - NEXULOOM_DEBUG=true
      - UDI_ENV=development
      - UDI_DEBUG=true
    volumes:
      # Live code mounting for seamless local development
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./main.py:/app/main.py
      - ./nexuloom.py:/app/nexuloom.py
      - ./udi.py:/app/udi.py
      # Persistent storage mounts (survive container restarts)
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      # External live project database mount (Derindex SQLite in WAL mode requires shm/wal access)
      - ../derindex/data:/app/external_data
    extra_hosts:
      # Allows connecting to databases running on host machine (e.g., host.docker.internal:5432)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional demo databases for testing enterprise connections (Start with: docker compose --profile demo-dbs up)
  postgres-demo:
    image: postgres:16-alpine
    container_name: nexuloom-postgres-demo
    profiles: ["demo-dbs"]
    environment:
      POSTGRES_USER: nexuloom
      POSTGRES_PASSWORD: nexuloom_secret
      POSTGRES_DB: analytics_db
    ports:
      - "5433:5432"
    volumes:
      - nexuloom-pgdata:/var/lib/postgresql/data

  mysql-demo:
    image: mysql:8.0
    container_name: nexuloom-mysql-demo
    profiles: ["demo-dbs"]
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: enterprise_crm
      MYSQL_USER: nexuloom
      MYSQL_PASSWORD: nexuloom_secret
    ports:
      - "3307:3306"
    volumes:
      - nexuloom-mysqldata:/var/lib/mysql

volumes:
  nexuloom-pgdata:
  nexuloom-mysqldata:
